<!DOCTYPE html><html><head><title>MiniTube</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0}
.top{background:#222;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,200px);gap:10px;padding:10px}
.card{background:#333;padding:5px}
video{width:100%}
</style></head><body>

<div class="top">
MiniTube
<input id=u placeholder=Username>
<button onclick="user=u.value">Set</button>
<input id=t placeholder="Video title">
<input type=file id=f>
<button onclick=up()>Upload</button>
</div>

<div id=v class=grid></div>

<script>
let user="",vid=JSON.parse(localStorage.v||"[]")

function up(){
let r=new FileReader()
r.onload=()=>{
vid.push({t:t.value,u:user,s:r.result,l:0})
localStorage.v=JSON.stringify(vid)
show()
}
r.readAsDataURL(f.files[0])
}

function like(i){
vid[i].l++
localStorage.v=JSON.stringify(vid)
show()
}

function show(){
v.innerHTML=""
vid.forEach((x,i)=>v.innerHTML+=
<div class=card>
<video src="${x.s}" controls></video>
<p>${x.t} - ${x.u}</p>
<button onclick=like(${i})>👍 ${x.l}</button>
</div>)
}

show()
</script>

</body></html>
