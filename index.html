<!DOCTYPE html>
<html>
<head>
<title>MiniTube</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center}
video{width:300px;margin:10px}
</style>
</head>
<body>

<h2>MiniTube</h2>

<input id="title" placeholder="Video title">
<input type="file" id="file">
<button onclick="upload()">Upload</button>

<div id="videos"></div>

<script>

let vids=[]

function upload(){
let f=file.files[0]
let r=new FileReader()

r.onload=function(){
vids.push({t:title.value,v:r.result})
show()
}

r.readAsDataURL(f)
}

function show(){
videos.innerHTML=""
vids.forEach(v=>{
videos.innerHTML+=
<div>
<video src="${v.v}" controls></video>
<p>${v.t}</p>
</div>
})
}

</script>

</body>
</html>
