<!DOCTYPE html>
<html>
<head>
<title>MiniTube</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
.top{background:#202020;padding:10px;display:flex}
.top input{flex:1;padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:10px}
.v{background:#222;padding:5px}
video{width:100%}
</style>
</head>
<body>

<div class="top">
<b style="margin-right:10px">MiniTube</b>
<input placeholder="Search videos">
</div>

<div class="grid">

<div class="v">
<video controls>
<source src="video1.mp4" type="video/mp4">
</video>
<p>My First Video</p>
</div>

<div class="v">
<video controls>
<source src="video2.mp4" type="video/mp4">
</video>
<p>Second Video</p>
</div>

<div class="v">
<video controls>
<source src="video3.mp4" type="video/mp4">
</video>
<p>Third Video</p>
</div>

</div>

</body>
</html>
