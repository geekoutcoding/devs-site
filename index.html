<!DOCTYPE html>
<html>
<head>
<title>MiniTube</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center}
video{width:300px;margin:10px}
</style>
</head>
<body>

<h2>MiniTube</h2>

<input id="title" placeholder="Video title">
<input type="file" id="file">
<button onclick="upload()">Upload</button>

<div id="videos"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT",
storageBucket: "YOUR_PROJECT.appspot.com"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

async function upload(){
let f=file.files[0]
let r=ref(storage,"videos/"+f.name)

await uploadBytes(r,f)

alert("Uploaded!")
loadVideos()
}

async function loadVideos(){
videos.innerHTML=""

let list=await listAll(ref(storage,"videos"))

for(let v of list.items){
let url=await getDownloadURL(v)

videos.innerHTML+=
<video src="${url}" controls></video>

}
}

loadVideos()

</script>

</body>
</html>
